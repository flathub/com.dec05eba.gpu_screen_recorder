app-id: com.dec05eba.gpu_screen_recorder
runtime: org.freedesktop.Platform
# 25.08 doesn't work on older intel devices that need i956_drv_video.so vaapi
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.ziglang
command: gpu-screen-recorder-gtk
separate-locales: false
finish-args:
  # Only dri and input devices are needed, but device doesn't seem supported input yet? need all instead
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-run/pipewire-0
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
  # These are needed to get the title of the active window, to save videos automatically
  # in a folder based on the games name
  - --talk-name=org.kde.KWin
  - --talk-name=org.gnome.Shell.Extensions

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/libdrm.a
  - /share/gtk-doc
  - /share/doc

modules:
  - dependencies/libayatana-appindicator3-0.1.yml

  - name: kms-server-proxy
    disabled: false
    buildsystem: simple
    build-commands:
      - ./build.sh
      - install -Dm755 kms-server-proxy "$FLATPAK_DEST/bin/kms-server-proxy"
    sources:
      - type: archive
        url: https://dec05eba.com/snapshot/kms-server-proxy.git.r32.64615b4.tar.gz
        sha512: 824d3d07372b66a979e0258de7de4fcc615c90e36f8ccfb8b3c2414b05ffa131c32a44a9c39681b48d93d941532bd8beb580f398512c4183b898bdf9b37b58f8
        strip-components: 0

  - name: gpu-screen-recorder
    disabled: false
    buildsystem: simple
    build-commands:
      - meson setup build
      - meson configure --prefix=$FLATPAK_DEST --buildtype=release -Dcapabilities=false
        -Dsystemd=false -Dnvidia_suspend_fix=false -Dffmpeg_static=true -Dstrip=true build
      - ninja -C build install
      - gcc kms/server/kms_server.c -o gsr-kms-server $FLATPAK_DEST/lib/libdrm.a -I$FLATPAK_DEST/include/libdrm
        $GSR_KMS_SERVER_OPTS
      - install -Dm755 gsr-kms-server "$FLATPAK_DEST/bin/gsr-kms-server"
      - strip "$FLATPAK_DEST/bin/gsr-kms-server"
      - strip "$FLATPAK_DEST/bin/gpu-screen-recorder"
    build-options:
      env:
        GSR_KMS_SERVER_OPTS: -fstack-protector-all -O3 -s -flto -Wall -Wextra -Werror
          -DNDEBUG -static -static-libgcc
    sources:
      - type: archive
        url: https://dec05eba.com/snapshot/gpu-screen-recorder.git.r1467.d31b698.tar.gz
        sha512: d6e4101d175e4f5097e73c78f7bd8fcd8ae2fee587e18b06a89d91b52a568c1a367d2723a19eb12b0959bb16e5dae6756ffedcfe20ef2a62ce1a660806ea82e4
        strip-components: 0
      - type: file
        url: https://ffmpeg.org/releases/ffmpeg-9.0.tar.xz
        sha256: 7f607a00dd0d28a729d5a4811205812eef01cf6ef6155025febb6f36a9062d52
        dest: subprojects/packagecache
        dest-filename: ffmpeg-9.0.tar.xz
      - type: file
        url: https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2
        sha256: a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
        dest: subprojects/packagecache
        dest-filename: mbedtls-3.6.7.tar.bz2
      - type: file
        url: https://github.com/FFmpeg/nv-codec-headers/archive/refs/tags/n13.0.19.0.tar.gz
        sha256: 86d15d1a7c0ac73a0eafdfc57bebfeba7da8264595bf531cf4d8db1c22940116
        dest: subprojects/packagecache
        dest-filename: nv-codec-headers-13.0.19.0.tar.gz
      - type: file
        url: https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz
        sha256: 6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1
        dest: subprojects/packagecache
        dest-filename: opus-1.6.1.tar.gz
      - type: file
        url: https://github.com/Haivision/srt/archive/refs/tags/v1.5.6.tar.gz
        sha256: 2c4980c2c4cfd142d21b829d939dc51db9c6628af5967fff62fd7290769569c7
        dest: subprojects/packagecache
        dest-filename: srt-1.5.6.tar.gz
      - type: file
        url: https://code.videolan.org/videolan/x264/-/archive/b35605ace3ddf7c1a5d67a2eb553f034aef41d55/x264-b35605ace3ddf7c1a5d67a2eb553f034aef41d55.tar.bz2
        sha256: 6eeb82934e69fd51e043bd8c5b0d152839638d1ce7aa4eea65a3fedcf83ff224
        dest: subprojects/packagecache
        dest-filename: x264-b35605ace3ddf7c1a5d67a2eb553f034aef41d55.tar.bz2
    modules:
      - name: libdrm
        buildsystem: meson
        config-opts:
          - -Dintel=disabled
          - -Dradeon=disabled
          - -Damdgpu=disabled
          - -Dnouveau=disabled
          - -Dvmwgfx=disabled
          - -Domap=disabled
          - -Dexynos=disabled
          - -Dfreedreno=disabled
          - -Dtegra=disabled
          - -Dvc4=disabled
          - -Detnaviv=disabled
          - -Dcairo-tests=disabled
          - -Dman-pages=disabled
          - -Dvalgrind=disabled
          - -Dtests=false
          - --default-library=static
          - --buildtype=release
        sources:
          - type: git
            url: https://gitlab.freedesktop.org/mesa/drm.git
            commit: ad78bb591d02162d3b90890aa4d0a238b2a37cde
            tag: libdrm-2.4.122

  - name: gpu-screen-recorder-gtk
    buildsystem: simple
    build-commands:
      - meson setup build
      - meson configure --prefix=$FLATPAK_DEST --buildtype=release -Dstrip=true build
      - ninja -C build
      - strip build/gpu-screen-recorder-gtk
      - install -Dm755 build/gpu-screen-recorder-gtk "$FLATPAK_DEST/bin/gpu-screen-recorder-gtk"
      - install -Dm644 com.dec05eba.gpu_screen_recorder.desktop "$FLATPAK_DEST/share/applications/com.dec05eba.gpu_screen_recorder.desktop"
      - install -Dm644 "icons/hicolor/32x32/status/com.dec05eba.gpu_screen_recorder.tray-idle.png"
        "$FLATPAK_DEST/share/icons/hicolor/32x32/status/com.dec05eba.gpu_screen_recorder.tray-idle.png"
      - install -Dm644 "icons/hicolor/32x32/status/com.dec05eba.gpu_screen_recorder.tray-recording.png"
        "$FLATPAK_DEST/share/icons/hicolor/32x32/status/com.dec05eba.gpu_screen_recorder.tray-recording.png"
      - install -Dm644 "icons/hicolor/32x32/status/com.dec05eba.gpu_screen_recorder.tray-paused.png"
        "$FLATPAK_DEST/share/icons/hicolor/32x32/status/com.dec05eba.gpu_screen_recorder.tray-paused.png"
      - install -Dm644 "icons/hicolor/32x32/apps/com.dec05eba.gpu_screen_recorder.png"
        "$FLATPAK_DEST/share/icons/hicolor/32x32/apps/com.dec05eba.gpu_screen_recorder.png"
      - install -Dm644 "icons/hicolor/64x64/status/com.dec05eba.gpu_screen_recorder.tray-idle.png"
        "$FLATPAK_DEST/share/icons/hicolor/64x64/status/com.dec05eba.gpu_screen_recorder.tray-idle.png"
      - install -Dm644 "icons/hicolor/64x64/status/com.dec05eba.gpu_screen_recorder.tray-recording.png"
        "$FLATPAK_DEST/share/icons/hicolor/64x64/status/com.dec05eba.gpu_screen_recorder.tray-recording.png"
      - install -Dm644 "icons/hicolor/64x64/status/com.dec05eba.gpu_screen_recorder.tray-paused.png"
        "$FLATPAK_DEST/share/icons/hicolor/64x64/status/com.dec05eba.gpu_screen_recorder.tray-paused.png"
      - install -Dm644 "icons/hicolor/64x64/apps/com.dec05eba.gpu_screen_recorder.png"
        "$FLATPAK_DEST/share/icons/hicolor/64x64/apps/com.dec05eba.gpu_screen_recorder.png"
      - install -Dm644 "icons/hicolor/128x128/status/com.dec05eba.gpu_screen_recorder.tray-idle.png"
        "$FLATPAK_DEST/share/icons/hicolor/128x128/status/com.dec05eba.gpu_screen_recorder.tray-idle.png"
      - install -Dm644 "icons/hicolor/128x128/status/com.dec05eba.gpu_screen_recorder.tray-recording.png"
        "$FLATPAK_DEST/share/icons/hicolor/128x128/status/com.dec05eba.gpu_screen_recorder.tray-recording.png"
      - install -Dm644 "icons/hicolor/128x128/status/com.dec05eba.gpu_screen_recorder.tray-paused.png"
        "$FLATPAK_DEST/share/icons/hicolor/128x128/status/com.dec05eba.gpu_screen_recorder.tray-paused.png"
      - install -Dm644 "icons/hicolor/128x128/apps/com.dec05eba.gpu_screen_recorder.png"
        "$FLATPAK_DEST/share/icons/hicolor/128x128/apps/com.dec05eba.gpu_screen_recorder.png"
      - gtk-update-icon-cache -q -t -f "$FLATPAK_DEST/share/icons/hicolor"
      - update-desktop-database -q "$FLATPAK_DEST/share/applications"
    sources:
      - type: archive
        url: https://dec05eba.com/snapshot/gpu-screen-recorder-gtk.git.r513.dade88d.tar.gz
        sha512: ae4619b02efdd6a79cbf8abf1112ebb70a8055f43e9fa09c2d22af7a19687887cf3f60f3f5228ded75cca23dd349fe8ebbbbe6cfa83d6131d46e761475c22791
        strip-components: 0

  - name: gpu-screen-recorder-appdata
    buildsystem: simple
    build-commands:
      - install -Dm644 com.dec05eba.gpu_screen_recorder.appdata.xml "$FLATPAK_DEST/share/metainfo/com.dec05eba.gpu_screen_recorder.appdata.xml"
    sources:
      - type: archive
        url: https://dec05eba.com/snapshot/gpu-screen-recorder-appdata.git.r43.c9c9cad.tar.gz
        sha512: 7e6701631624c2bb1a8d449ea8747c3805ad24c3071194819f730c99e1d4e45d7fffaab9ac82859fa5f935f3b96b53f010592f534a374fcc93a45945076877d0
        strip-components: 0

  - name: gpu-screen-recorder-ui
    buildsystem: simple
    build-commands:
      - meson setup build
      - meson configure --prefix=$FLATPAK_DEST --buildtype=release -Dstrip=true -Ddesktop-files=false
        -Dcapabilities=false build
      - ninja -C build install
      - /usr/lib/sdk/ziglang/zig cc -target "$(uname -m)"-linux-musl tools/gsr-global-hotkeys/*.c
        -O2 -g0 -s -fstack-protector-all -o gsr-global-hotkeys
      - /usr/lib/sdk/ziglang/zig cc -target "$(uname -m)"-linux-musl tools/gsr-game-tracker/*.c
        -O2 -g0 -s -o gsr-game-tracker
      - /usr/lib/sdk/ziglang/zig cc -target "$(uname -m)"-linux-musl tools/gsr-wayland-bridge/*.c
        -O2 -g0 -s -o gsr-wayland-bridge
      - install -Dm755 gsr-global-hotkeys "$FLATPAK_DEST/bin/gsr-global-hotkeys"
      - install -Dm755 gsr-game-tracker "$FLATPAK_DEST/bin/gsr-game-tracker"
      - install -Dm755 gsr-wayland-bridge "$FLATPAK_DEST/bin/gsr-wayland-bridge"
      - strip "$FLATPAK_DEST/bin/gsr-ui"
      - strip "$FLATPAK_DEST/bin/gsr-global-hotkeys"
      - strip "$FLATPAK_DEST/bin/gsr-game-tracker"
      - strip "$FLATPAK_DEST/bin/gsr-wayland-bridge"
    sources:
      - type: archive
        url: https://dec05eba.com/snapshot/gpu-screen-recorder-ui.git.r720.edfc70d.tar.gz
        sha512: 036f01a329f82c8190ddb0a1f2c8db10fa91cc1b9da9925d518606387ee92c82821b275418e5b22f08fa7d038caba049fccf9babad8d86159f17f921db957901
        strip-components: 0

  - name: gpu-screen-recorder-notification
    buildsystem: meson
    config-opts:
      - --buildtype=release
      - -Dstrip=true
    sources:
      - type: archive
        url: https://dec05eba.com/snapshot/gpu-screen-recorder-notification.git.r110.8db3818.tar.gz
        sha512: 70db106f4a43d0faa2d288dd0a5a505dc757b791a5488606c4667c78c4448034552e735238241b4b58d3897b062962ffafe15f1fbfa176cb8f0ab82f6a2f0f14
        strip-components: 0
